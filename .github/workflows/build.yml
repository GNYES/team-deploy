name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle wrapper mirror
        run: |
          cd app/android/gradle/wrapper/
          sed -i 's|https://services.gradle.org/distributions/|https://mirrors.cloud.tencent.com/gradle/|' gradle-wrapper.properties
          sed -i 's|networkTimeout=10000|networkTimeout=300000|' gradle-wrapper.properties

      - name: Configure Maven mirror
        run: |
          cd app/android
          cat > build.gradle << 'GRADLE'
buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
    }
}
apply from: "variables.gradle"
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
GRADLE

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Build Web App
        working-directory: ./app
        run: npm run build

      - name: Add Android platform
        working-directory: ./app
        run: npx cap add android

      - name: Sync to Android
        working-directory: ./app
        run: npx cap sync android

      - name: Build APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: team-deploy-apk
          path: ./app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
